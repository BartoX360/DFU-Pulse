name: DFUPulse
options:
  bundleIdPrefix: fr.bartox
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    MARKETING_VERSION: "0.5.3"
    CURRENT_PROJECT_VERSION: "10"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: 6LKS98VG4F
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
  configs:
    Release:
      CODE_SIGN_IDENTITY: "Developer ID Application"
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      # Notarization refuses the debugger entitlement Xcode adds by default.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
targets:
  DFUPulse:
    type: application
    platform: macOS
    sources:
      - DFUPulse
      - Shared
      - path: Helper/fr.bartox.DFUPulse.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - target: macvdmtool
        embed: true
        copy:
          destination: executables
      - target: DFUPulseHelper
        embed: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_NAME: DFU Pulse
        PRODUCT_BUNDLE_IDENTIFIER: fr.bartox.DFUPulse
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DFU Pulse
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "Free software under GPL-3.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  DFUPulseHelper:
    type: tool
    platform: macOS
    sources:
      - path: Helper
        excludes: ["*.plist"]
      - Shared
  macvdmtool:
    type: tool
    platform: macOS
    sources:
      - path: Vendor/macvdmtool
        includes: ["main.cpp", "*.h"]
    settings:
      base:
        CLANG_CXX_LANGUAGE_STANDARD: c++14
        OTHER_LDFLAGS: ["-framework", "CoreFoundation", "-framework", "IOKit"]
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
  DFUPulseTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - DFUPulseTests
    dependencies:
      - target: DFUPulse
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DFU Pulse.app/Contents/MacOS/DFU Pulse"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  DFUPulse:
    build:
      targets:
        DFUPulse: all
    test:
      targets:
        - DFUPulseTests
