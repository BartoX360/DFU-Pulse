name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: xcodebuild -project DFUPulse.xcodeproj -scheme DFUPulse test
      - name: Package
        run: scripts/package.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/DFU-Pulse-*.dmg --generate-notes
